name = "dnd-remote-relay"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "DEVICE_ROOM"
class_name = "DeviceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceRoom"]

# Secrets (set these with `wrangler secret put NAME`, do NOT put real
# values here):
#   DEVICE_TOKENS  - comma-separated tokens the Android app can register with
#   WEBAPP_TOKENS  - comma-separated tokens the webapp dashboard can register with
